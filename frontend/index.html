    <style>
      #cmg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 1;
        transition: opacity 320ms ease, visibility 320ms ease;
      }
      #cmg-boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .cmg-boot-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: min(42vw, 220px);
        height: min(42vw, 220px);
      }
      /* Soft ripple rings that radiate out behind the logo. */
      .cmg-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(255, 122, 0, .45);
        opacity: 0;
        animation: cmg-boot-ripple 2.4s ease-out infinite;
      }
      .cmg-boot-ring--2 { animation-delay: 1.2s; border-color: rgba(22, 101, 52, .35); }
      .cmg-boot-logo {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        animation:
          cmg-boot-enter 900ms cubic-bezier(.22, 1, .36, 1) both,
          cmg-boot-heartbeat 1.6s ease-in-out 900ms infinite;
        box-shadow: 0 12px 32px rgba(15, 23, 42, .18);
      }
      .cmg-boot-logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* Light sweep across the logo, clipped to the circle. */
      .cmg-boot-logo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%);
        transform: translateX(-120%);
        animation: cmg-boot-shine 2.2s ease-in-out 1s infinite;
      }
      /* Loading dots under the logo. */
      .cmg-boot-dots {
        position: absolute;
        bottom: -44px;
        left: 50%;
        display: flex;
        gap: 8px;
        transform: translateX(-50%);
      }
      .cmg-boot-dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #FF7A00;
        animation: cmg-boot-bounce 1.1s ease-in-out infinite;
      }
      .cmg-boot-dots span:nth-child(2) { background: #FFC93C; animation-delay: .15s; }
      .cmg-boot-dots span:nth-child(3) { background: #166534; animation-delay: .3s; }
      @keyframes cmg-boot-enter {
        0% { opacity: 0; transform: scale(.7) translateY(12px) rotate(-8deg); }
        60% { opacity: 1; transform: scale(1.06) translateY(-2px) rotate(1deg); }
        100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
      }
      @keyframes cmg-boot-heartbeat {
        0%, 100% { transform: scale(1); }
        14% { transform: scale(1.05); }
        28% { transform: scale(1); }
        42% { transform: scale(1.03); }
        56% { transform: scale(1); }
      }
      @keyframes cmg-boot-ripple {
        0% { transform: scale(.95); opacity: .9; }
        100% { transform: scale(1.55); opacity: 0; }
      }
      @keyframes cmg-boot-shine {
        0% { transform: translateX(-120%); }
        55%, 100% { transform: translateX(120%); }
      }
      @keyframes cmg-boot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: .45; }
        40% { transform: translateY(-7px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #cmg-boot-splash,
        #cmg-boot-splash * { animation: none !important; transition: none !important; }
        .cmg-boot-ring { display: none; }
      }
    </style>
