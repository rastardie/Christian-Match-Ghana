name: Deploy frontend to production (Stormer Host)

# Manual trigger only.
#   mode = backup-only : snapshot the current production web root to an artifact
#                        (READ-ONLY on the server; safe to run anytime).
#   mode = full        : snapshot, then build + upload the production frontend to
#                        public_html (root). Requires confirm = DEPLOY.
# Uses key-based SFTP (christi3). FTPS password auth is NOT used — it is blocked
# from GitHub runner IPs by the host.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup-only (snapshot prod) or full (snapshot + deploy)'
        required: true
        default: 'backup-only'
        type: choice
        options:
          - backup-only
          - full
      confirm:
        description: 'Type DEPLOY to confirm a PRODUCTION deploy (only used when mode=full)'
        required: false
        default: ''

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SFTP_HOST: ${{ secrets.CMG_SFTP_HOST }}
      SFTP_USER: ${{ secrets.CMG_SFTP_USER }}
    steps:
      - name: Guard — confirm production deploy
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "full" ] && [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "mode=full requires confirm=DEPLOY. Aborting."
            exit 1
          fi
          echo "mode=$MODE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SFTP key + pinned host key
        env:
          SFTP_KEY: ${{ secrets.CMG_SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.CMG_SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .ssh
          printf '%s\n' "$SFTP_KEY" > .ssh/id_deploy
          chmod 600 .ssh/id_deploy
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > .ssh/known_hosts
          chmod 644 .ssh/known_hosts
          cat > .ssh/ssh_wrap <<EOF
          #!/bin/sh
          exec ssh -a -x -i "$PWD/.ssh/id_deploy" -o UserKnownHostsFile="$PWD/.ssh/known_hosts" -o StrictHostKeyChecking=yes -l "$SFTP_USER" "\$@"
          EOF
          chmod +x .ssh/ssh_wrap

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Backup current production web root (read-only)
        run: |
          install -d backup
          lftp -e "
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:persist-retries 0;
            set sftp:connect-program $PWD/.ssh/ssh_wrap;
            set cmd:fail-exit true;
            open sftp://$SFTP_USER@$SFTP_HOST:22;
            mirror --verbose \
              --exclude-glob *.zip \
              --exclude ^dev/ \
              --exclude ^test\\.christianmatchghana\\.com/ \
              --exclude ^\\.well-known/ \
              public_html/ $PWD/backup/ ;
            bye
          "
          echo '--- backup contents (top level) ---'
          ls -la backup
          tar -czf prod-root-backup.tgz -C backup .
          echo "backup size: $(du -h prod-root-backup.tgz | cut -f1)"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-root-backup-${{ github.run_number }}
          path: prod-root-backup.tgz
          retention-days: 30
          if-no-files-found: error

      # ---- below here runs only for mode=full ----

      - name: Setup Node
        if: ${{ github.event.inputs.mode == 'full' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ github.event.inputs.mode == 'full' }}
        working-directory: frontend
        run: npm ci

      - name: Write production environment
        if: ${{ github.event.inputs.mode == 'full' }}
        working-directory: frontend
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
        run: |
          {
            echo "VITE_APP_ENV=production"
            echo "VITE_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=christianmatch-app.firebaseapp.com"
            echo "VITE_FIREBASE_PROJECT_ID=christianmatch-app"
            echo "VITE_FIREBASE_STORAGE_BUCKET=christianmatch-app.firebasestorage.app"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=121785138277"
            echo "VITE_FIREBASE_APP_ID=1:121785138277:web:8b50120389715533401a8c"
            echo "VITE_FIREBASE_MEASUREMENT_ID=G-9KH1V7C045"
            echo "VITE_FIREBASE_FUNCTIONS_REGION=us-central1"
            echo "VITE_USE_FIREBASE_EMULATORS=false"
            echo "VITE_PUBLIC_APP_URL=https://christianmatchghana.com"
            echo "VITE_PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}"
          } > .env.production

      - name: Build (production)
        if: ${{ github.event.inputs.mode == 'full' }}
        working-directory: frontend
        run: npm run build -- --mode production

      - name: Verify build output
        if: ${{ github.event.inputs.mode == 'full' }}
        run: test -f frontend/dist/index.html

      - name: Deploy to production root via SFTP (key auth)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          lftp -e "
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:persist-retries 0;
            set sftp:connect-program $PWD/.ssh/ssh_wrap;
            set cmd:fail-exit true;
            open sftp://$SFTP_USER@$SFTP_HOST:22;
            mirror -R --verbose --exclude-glob .DS_Store frontend/dist/ public_html/ ;
            bye
          "

      - name: Verify site responds
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://christianmatchghana.com/ || true)"
          echo "HTTP ${code}"
          [ "$code" = "200" ] || { echo "Verification failed: HTTP ${code}"; exit 1; }

      - name: Cleanup key
        if: ${{ always() }}
        run: rm -f .ssh/id_deploy