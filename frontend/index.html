    <style>
      #cmg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 1;
        transition: opacity 320ms ease, visibility 320ms ease;
      }
      #cmg-boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #cmg-boot-splash img {
        width: min(42vw, 220px);
        height: min(42vw, 220px);
        object-fit: contain;
        animation: cmg-boot-logo 900ms cubic-bezier(.22, 1, .36, 1) both;
      }
      @keyframes cmg-boot-logo {
        0% { opacity: 0; transform: scale(.78) rotate(-6deg); }
        65% { opacity: 1; transform: scale(1.04) rotate(1deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #cmg-boot-splash,
        #cmg-boot-splash img { animation: none; transition: none; }
      }
