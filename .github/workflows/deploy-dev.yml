name: Deploy frontend to /dev (staging)

# Manual trigger only. Builds the staging-web frontend and uploads it to the
# /dev subdirectory of the live document root via explicit FTPS.
# This NEVER touches the production site root — only public_html/dev.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-DEV to confirm a staging deploy to /dev'
        required: true
        default: ''

concurrency:
  group: deploy-dev-staging
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard — require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY-DEV" ]; then
            echo "Confirmation not provided. Re-run and type DEPLOY-DEV to proceed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Write staging environment
        working-directory: frontend
        env:
          STAGING_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
        run: |
          {
            echo "VITE_APP_ENV=staging"
            echo "VITE_BASE_PATH=/dev/"
            echo "VITE_FIREBASE_API_KEY=${STAGING_FIREBASE_API_KEY}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=christian-match-ghana.firebaseapp.com"
            echo "VITE_FIREBASE_PROJECT_ID=christian-match-ghana"
            echo "VITE_FIREBASE_STORAGE_BUCKET=christian-match-ghana.firebasestorage.app"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=481815915882"
            echo "VITE_FIREBASE_APP_ID=1:481815915882:web:6983b79d40683343b40913"
            echo "VITE_FIREBASE_MEASUREMENT_ID=G-F76PZEGZFJ"
            echo "VITE_FIREBASE_FUNCTIONS_REGION=us-central1"
            echo "VITE_USE_FIREBASE_EMULATORS=false"
            echo "VITE_PUBLIC_APP_URL=https://christianmatchghana.com/dev"
          } > .env.staging-web

      - name: Build (staging-web)
        working-directory: frontend
        run: npm run build:staging

      - name: Verify build output
        run: test -f frontend/dist/index.html

      - name: Write SPA .htaccess for /dev
        run: |
          cat > frontend/dist/.htaccess <<'HT'
          RewriteEngine On
          RewriteBase /dev/
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]
          HT

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to /dev via SFTP (key auth)
        env:
          SFTP_HOST: ${{ secrets.CMG_SFTP_HOST }}
          SFTP_USER: ${{ secrets.CMG_SFTP_USER }}
          SFTP_KEY: ${{ secrets.CMG_SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.CMG_SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .ssh
          printf '%s\n' "$SFTP_KEY" > .ssh/id_deploy
          chmod 600 .ssh/id_deploy
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > .ssh/known_hosts
          chmod 644 .ssh/known_hosts
          cat > .ssh/ssh_wrap <<EOF
          #!/bin/sh
          exec ssh -a -x -i "$PWD/.ssh/id_deploy" -o UserKnownHostsFile="$PWD/.ssh/known_hosts" -o StrictHostKeyChecking=yes -l "$SFTP_USER" "\$@"
          EOF
          chmod +x .ssh/ssh_wrap
          lftp -e "
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set net:persist-retries 0;
            set sftp:connect-program $PWD/.ssh/ssh_wrap;
            open sftp://$SFTP_USER@$SFTP_HOST:22;
            mkdir -p public_html/dev;
            set cmd:fail-exit true;
            mirror -R --verbose --exclude-glob .DS_Store frontend/dist/ public_html/dev/;
            bye
          "
          rm -f .ssh/id_deploy

      - name: Verify /dev responds
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://christianmatchghana.com/dev/ || true)"
          echo "HTTP ${code}"
          [ "$code" = "200" ] || { echo "Verification failed: HTTP ${code}"; exit 1; }
