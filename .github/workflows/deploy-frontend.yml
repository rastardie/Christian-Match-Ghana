name: Deploy frontend to Stormer Host

# Manual trigger only — production updates when you click "Run workflow".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production frontend deploy'
        required: true
        default: ''

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation not provided. Re-run and type DEPLOY to proceed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Write production environment
        working-directory: frontend
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
        run: |
          {
            echo "VITE_APP_ENV=production"
            echo "VITE_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=christianmatch-app.firebaseapp.com"
            echo "VITE_FIREBASE_PROJECT_ID=christianmatch-app"
            echo "VITE_FIREBASE_STORAGE_BUCKET=christianmatch-app.firebasestorage.app"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=121785138277"
            echo "VITE_FIREBASE_APP_ID=1:121785138277:web:8b50120389715533401a8c"
            echo "VITE_FIREBASE_MEASUREMENT_ID=G-9KH1V7C045"
            echo "VITE_FIREBASE_FUNCTIONS_REGION=us-central1"
            echo "VITE_USE_FIREBASE_EMULATORS=false"
            echo "VITE_PUBLIC_APP_URL=https://christianmatchghana.com"
            echo "VITE_PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}"
          } > .env.production

      - name: Build
        working-directory: frontend
        run: npm run build -- --mode production

      - name: Verify build output
        run: test -f frontend/dist/index.html

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to Stormer Host
        env:
          DEPLOY_HOST: ${{ secrets.STORMERHOST_HOST }}
          DEPLOY_PORT: ${{ secrets.STORMERHOST_PORT }}
          DEPLOY_USER: ${{ secrets.STORMERHOST_USER }}
          DEPLOY_PASS: ${{ secrets.STORMERHOST_PASS }}
          DEPLOY_REMOTE_DIR: ${{ secrets.STORMERHOST_REMOTE_DIR }}
          DEPLOY_PROTOCOL: ${{ secrets.STORMERHOST_PROTOCOL }}
        run: |
          PROTO="${DEPLOY_PROTOCOL:-sftp}"
          PORT="${DEPLOY_PORT:-22}"
          REMOTE="${DEPLOY_REMOTE_DIR:-public_html}"
          lftp -e "set sftp:auto-confirm yes; set net:timeout 20; set ftp:ssl-allow true; open -u \"$DEPLOY_USER\",\"$DEPLOY_PASS\" $PROTO://$DEPLOY_HOST:$PORT; mirror -R --verbose --exclude-glob .DS_Store frontend/dist/ \"$REMOTE/\"; bye"

      - name: Verify site responds
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' https://christianmatchghana.com/ || true)"
          echo "HTTP ${code}"
